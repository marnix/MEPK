# CI for MEPK.
#
# - `build` runs on every pushed commit (any branch) and on pull requests:
#   `mvn clean verify site` on JDK 17. `verify` compiles and runs the tests;
#   `site` generates the Javadoc HTML (via the maven-javadoc-plugin <reporting>
#   config in pom.xml), so a Javadoc error fails this job too. The compiled
#   build output is intentionally NOT kept as an artifact (there is currently
#   no need to distribute binaries; see the "distribute binaries?" to-do in
#   README.md). On the default branch, the generated Javadoc HTML is uploaded
#   as the GitHub Pages artifact.
#
# - `deploy-docs` runs only for the default branch (master) and does NO Maven
#   work: it just deploys the Pages artifact the build job produced, to
#   https://<owner>.github.io/MEPK/.
#
# Toolchain:
#   - Java 17: selected via setup-java from the JDKs pre-installed in the
#     runner image (no download). pom.xml uses maven.compiler.release=17, so
#     any JDK >= 17 produces the same Java-17 class files (bytecode major 61).
#   - Maven: the runner image's bundled Maven is used (no setup-maven download).
#     The runner image is versioned and its contents are documented, which is
#     the pin against surprises: as of runner image 20260907.300.1
#     (ubuntu-24.04) the documented versions are Maven 3.9.16 and JDK 17.0.20.
#     See https://github.com/actions/runner-images ubuntu readme.
#     Caveat: ubuntu-latest rolls forward to newer image versions over time, so
#     the bundled Maven may change (e.g. to 3.9.17+). The `mvn -version` step
#     below logs the exact Maven/JDK used on every run, so any such drift is
#     visible in the build log rather than a silent surprise. (For a harder pin
#     one could set `runs-on: ubuntu-24.04`, but GitHub eventually retires old
#     image labels, so that is not durable either.)
#
# Cost / caching notes:
#   - The JDK is not downloaded (pre-installed in the runner image).
#   - Maven itself is not downloaded (bundled in the runner image).
#   - Maven *dependencies* (~/.m2/repository) are cached across runs via
#     `cache: maven` on setup-java, keyed on the pom hash — the main time saver.

name: CI

on:
  push:
  pull_request:

# Least-privilege by default; the docs job adds what it needs below.
permissions:
  contents: read

jobs:
  build:
    name: Build, test and Javadoc (JDK 17, bundled Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Show toolchain versions
        run: mvn -version
      # Seed ~/.m2 with ALL project + plugin dependencies before building.
      # setup-java's cache: maven does not re-save on a cache hit, and Maven
      # resolves plugins lazily, so whatever the cache-creating run does not
      # download here would otherwise be re-fetched on every later run. This
      # makes the first (cache-creating) run comprehensive. See setup-java
      # docs/advanced-usage.md "Ensuring the Maven cache is complete".
      - name: Seed the Maven cache
        run: mvn -B dependency:go-offline dependency:resolve-plugins
      # `verify` builds and tests; `site` generates the Javadoc HTML (via the
      # maven-javadoc-plugin <reporting> config in pom.xml) into
      # target/site/apidocs. A Javadoc error therefore fails this build job.
      - name: Build, test and generate Javadoc
        run: mvn -B clean verify site
      # Hand the already-generated Javadoc to the deploy job as the Pages
      # artifact, so that job does no Maven work. Only needed on the default
      # branch, which is the only place we publish.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/apidocs

  deploy-docs:
    name: Publish Javadoc to GitHub Pages
    # Only publish docs for the latest commit on the default branch.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write          # to deploy to Pages
      id-token: write        # for the Pages OIDC deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Avoid overlapping Pages deployments.
    concurrency:
      group: pages
      cancel-in-progress: true
    # No checkout / JDK / Maven here: this job only deploys the Pages artifact
    # that the build job already produced.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
